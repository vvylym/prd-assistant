[package]
name = "prd-assistant"
description = "A tool for managing PRDs"
authors = ["vvylym <235853469+vvylym@users.noreply.github.com>"]
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
rig-core = { version = "0.22.0", features = ["derive"] }
reqwest = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
mockall = "0.12"
cargo-tarpaulin = "0.27"
once_cell = "1.19"

