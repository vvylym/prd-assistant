[package]
name = "prd-assistant"
description = "A tool for managing PRDs"
authors = ["vvylym <235853469+vvylym@users.noreply.github.com>"]
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.49", features = ["derive"] }
colored = "3.0.0"
rig-core = { version = "0.22.0", features = ["derive"] }
reqwest = "0.12.24"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
